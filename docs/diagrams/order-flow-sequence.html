<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>订单 token 交付动线 · Sequence</title>
  <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Geist:wght@400;500;600&family=Geist+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@400;500&family=Noto+Sans+SC:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --color-paper:   #f5f5f5;
      --color-ink:     #2d3142;
      --color-muted:   #4f5d75;
      --color-accent:  #bf4520;
      --font-sans:     'Geist', 'Noto Sans SC', system-ui, sans-serif;
      --font-serif:    'Instrument Serif', 'Noto Serif SC', serif;
      --font-mono:     'Geist Mono', 'Noto Sans SC', ui-monospace, monospace;
    }
    body {
      font-family: var(--font-sans);
      background: var(--color-paper);
      color: var(--color-ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 3rem 2rem;
    }
    .frame { max-width: 1200px; width: 100%; overflow-x: auto; }
    .eyebrow {
      font-family: var(--font-mono);
      font-size: 0.66rem;
      font-weight: 500;
      letter-spacing: 0.18em;
      text-transform: uppercase;
      color: var(--color-muted);
      margin-bottom: 0.5rem;
    }
    h1 {
      font-family: var(--font-serif);
      font-size: clamp(1.5rem, 2.4vw + 0.75rem, 2rem);
      font-weight: 400;
      letter-spacing: -0.02em;
      line-height: 1.15;
      color: var(--color-ink);
      margin-bottom: 1.5rem;
    }
    svg { width: 100%; min-width: 1000px; display: block; }
  </style>
</head>
<body>
  <div class="frame">
    <p class="eyebrow">Sequence · D13 v2 订单通道</p>
    <h1>智能体冷启动包 · 用户下单到拿货动线</h1>

    <svg viewBox="0 0 1000 880" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="order-flow-sequence-title order-flow-sequence-desc">
      <title id="order-flow-sequence-title">订单 token 交付动线</title>
      <desc id="order-flow-sequence-desc">时序图：买家下单后，维护者在 GitHub Actions 云端签发订单 token 并写私有订单日志，经微信发货给买家命令；买家执行命令从阿里云 OSS 下载签名包并安装，每周重跑同一命令完成更新。</desc>
        <defs>
          <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
            <circle cx="1" cy="1" r="0.9" fill="rgba(45,49,66,0.10)"/>
          </pattern>
          <marker id="arrow" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#4f5d75"/>
          </marker>
          <marker id="arrow-accent" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#bf4520"/>
          </marker>
          <marker id="arrow-link" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
            <polygon points="0 0, 8 3, 0 6" fill="#2e5aa8"/>
          </marker>
        </defs>

        <rect width="100%" height="100%" fill="#f5f5f5"/>
        <rect width="100%" height="100%" fill="url(#dots)" opacity="0.55"/>

        <!-- ============ LIFELINES（买家 128 / OSS 352 / 维护者 584 / GH Actions 800） ============ -->
        <line x1="128" y1="128" x2="128" y2="768" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="352" y1="128" x2="352" y2="768" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="584" y1="128" x2="584" y2="768" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>
        <line x1="800" y1="128" x2="800" y2="768" stroke="rgba(45,49,66,0.22)" stroke-width="1" stroke-dasharray="3,3"/>

        <!-- ============ ACTIVATION BARS ============ -->
        <rect x="580" y="180" width="8" height="328" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="796" y="236" width="8" height="220" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <rect x="348" y="356" width="8" height="284" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>

        <!-- ============ LOOP 片段框架（仅买家 + OSS 参与循环） ============ -->
        <rect x="104" y="548" width="272" height="228" rx="4" fill="rgba(45,49,66,0.02)" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <rect x="104" y="548" width="40" height="16" rx="2" fill="#f5f5f5" stroke="rgba(45,49,66,0.22)" stroke-width="1"/>
        <text x="124" y="560" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.12em">LOOP</text>
        <text x="116" y="580" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" letter-spacing="0.04em">[每周重跑同一命令 / 双击 update-token.bat]</text>

        <!-- ============ MESSAGE ARROWS ============ -->
        <!-- M1 买家→维护者：下单支付 -->
        <line x1="128" y1="176" x2="580" y2="176" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M2 维护者→GH Actions：触发云端签发 -->
        <line x1="584" y1="232" x2="796" y2="232" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M3 GH Actions 自消息：生成 token -->
        <path d="M 808 280 L 840 280 L 840 312 L 808 312" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>
        <!-- M4 GH Actions→OSS：上传 token 脚本 + 订单日志 -->
        <line x1="796" y1="352" x2="360" y2="352" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M5 OSS→GH Actions：返回自检结果 -->
        <line x1="352" y1="408" x2="796" y2="408" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M6 GH Actions→维护者：返回买家命令 -->
        <line x1="796" y1="456" x2="588" y2="456" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M7 维护者→买家：发货（核心交付 · coral） -->
        <line x1="580" y1="504" x2="132" y2="504" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <!-- M8 买家→OSS：执行 irm 命令 -->
        <line x1="128" y1="600" x2="348" y2="600" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M9 OSS→买家：返回当周 bootstrap -->
        <line x1="352" y1="636" x2="132" y2="636" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <!-- M10 买家→OSS：下载签名 zip -->
        <line x1="128" y1="672" x2="348" y2="672" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <!-- M11 买家自消息：安装/增量更新 -->
        <path d="M 132 700 L 164 700 L 164 728 L 132 728" fill="none" stroke="#4f5d75" stroke-width="1.2" marker-end="url(#arrow)"/>

        <!-- ============ MESSAGE LABELS（先 mask 后文字） ============ -->
        <rect x="202" y="160" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="250" y="170" fill="#2e5aa8" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">下单支付 ¥20/¥30</text>

        <rect x="644" y="216" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="692" y="226" fill="#2e5aa8" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">触发签发·SKU+单号</text>

        <rect x="848" y="288" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="894" y="298" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">生成TOKEN·签名</text>

        <rect x="408" y="336" width="104" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="346" fill="#2e5aa8" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">PUT TOKEN+订单日志</text>

        <rect x="412" y="392" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="460" y="402" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">200·自检通过</text>

        <rect x="644" y="440" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="692" y="450" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">返回买家命令</text>

        <rect x="206" y="488" width="88" height="12" rx="2" fill="#f5f5f5"/>
        <text x="250" y="498" fill="#bf4520" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">发货·IRM 命令</text>

        <rect x="192" y="584" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="238" y="594" fill="#2e5aa8" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">IRM TOKEN 命令</text>

        <rect x="192" y="620" width="96" height="12" rx="2" fill="#f5f5f5"/>
        <text x="240" y="630" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">当周脚本·签名URL</text>

        <rect x="188" y="656" width="100" height="12" rx="2" fill="#f5f5f5"/>
        <text x="238" y="666" fill="#2e5aa8" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">GET ZIP·SHA256 ✓</text>

        <rect x="172" y="704" width="92" height="12" rx="2" fill="#f5f5f5"/>
        <text x="218" y="714" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">ASP 安装/更新</text>

        <!-- ============ ACTOR BOXES ============ -->
        <!-- 买家（外部） -->
        <rect x="56" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="56" y="72" width="144" height="56" rx="6" fill="rgba(79,93,117,0.10)" stroke="#5a6580" stroke-width="1"/>
        <rect x="64" y="80" width="28" height="12" rx="2" fill="transparent" stroke="rgba(90,101,128,0.40)" stroke-width="0.8"/>
        <text x="78" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">BUY</text>
        <text x="128" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">买家</text>
        <text x="128" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">Windows / macOS</text>

        <!-- 阿里云 OSS（焦点） -->
        <rect x="280" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="280" y="72" width="144" height="56" rx="6" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <rect x="288" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(191,69,32,0.50)" stroke-width="0.8"/>
        <text x="304" y="89" fill="#bf4520" font-size="7" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">OSS</text>
        <text x="352" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">阿里云 OSS</text>
        <text x="352" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">token·签名包·日志</text>

        <!-- 维护者 -->
        <rect x="512" y="72" width="144" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="512" y="72" width="144" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="520" y="80" width="32" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="536" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">SELL</text>
        <text x="584" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">维护者</text>
        <text x="584" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">xjinya · 微信发货</text>

        <!-- GitHub Actions（云端自动化） -->
        <rect x="724" y="72" width="152" height="56" rx="6" fill="#f5f5f5"/>
        <rect x="724" y="72" width="152" height="56" rx="6" fill="rgba(45,49,66,0.03)" stroke="rgba(45,49,66,0.30)" stroke-width="1"/>
        <rect x="732" y="80" width="24" height="12" rx="2" fill="transparent" stroke="rgba(45,49,66,0.22)" stroke-width="0.8"/>
        <text x="744" y="89" fill="#5a6580" font-size="7" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle" letter-spacing="0.08em">CI</text>
        <text x="800" y="104" fill="#2d3142" font-size="12" font-weight="600" font-family="'Geist','Noto Sans SC',sans-serif" text-anchor="middle">GitHub Actions</text>
        <text x="800" y="119" fill="#4f5d75" font-size="9" font-family="'Geist Mono','Noto Sans SC',monospace" text-anchor="middle">云端签发·不依赖本机</text>

        <!-- ============ LEGEND ============ -->
        <line x1="56" y1="800" x2="944" y2="800" stroke="rgba(45,49,66,0.10)" stroke-width="0.8"/>
        <text x="56" y="816" fill="#4f5d75" font-size="8" font-family="'Geist Mono','Noto Sans SC',monospace" letter-spacing="0.18em">LEGEND</text>

        <rect x="56" y="836" width="14" height="10" rx="2" fill="rgba(191,69,32,0.08)" stroke="#bf4520" stroke-width="1"/>
        <text x="76" y="844" fill="#4f5d75" font-size="8.5" font-family="'Geist','Noto Sans SC',sans-serif">焦点模块</text>

        <rect x="188" y="832" width="4" height="18" fill="rgba(45,49,66,0.06)" stroke="#4f5d75" stroke-width="0.8"/>
        <text x="200" y="844" fill="#4f5d75" font-size="8.5" font-family="'Geist','Noto Sans SC',sans-serif">激活期</text>

        <line x1="288" y1="842" x2="316" y2="842" stroke="#2e5aa8" stroke-width="1.2" marker-end="url(#arrow-link)"/>
        <text x="324" y="844" fill="#4f5d75" font-size="8.5" font-family="'Geist','Noto Sans SC',sans-serif">HTTPS 请求</text>

        <line x1="444" y1="842" x2="472" y2="842" stroke="#4f5d75" stroke-width="1.2" stroke-dasharray="5,4" marker-end="url(#arrow)"/>
        <text x="480" y="844" fill="#4f5d75" font-size="8.5" font-family="'Geist','Noto Sans SC',sans-serif">返回 / 响应</text>

        <line x1="600" y1="842" x2="628" y2="842" stroke="#bf4520" stroke-width="1.4" marker-end="url(#arrow-accent)"/>
        <text x="636" y="844" fill="#4f5d75" font-size="8.5" font-family="'Geist','Noto Sans SC',sans-serif">核心交付</text>

        <text x="744" y="844" fill="#5a6580" font-size="8.5" font-family="'Geist','Noto Sans SC',sans-serif">LOOP = 每周更新循环</text>

      </svg>
  </div>
</body>
</html>
