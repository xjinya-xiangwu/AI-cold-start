[mcp_servers.asp-playwright]
command = "npx"
args = ["-y", "@playwright/mcp@latest"]

[mcp_servers.asp-filesystem]
command = "npx"
args = ["-y", "@modelcontextprotocol/server-filesystem", "C:/Users/Public/Documents"]

[mcp_servers.asp-supabase]
command = "npx"
args = ["-y", "mcp-remote", "https://mcp.supabase.com/mcp"]
