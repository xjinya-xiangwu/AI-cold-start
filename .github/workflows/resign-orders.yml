# =====================================================================
# resign-orders.yml - 每 3 天自动重签全部订单（刷新 presigned 下载链接）+
#   产出「当前有效买家命令清单」摘要（发群/私信素材）。
# 激活方式（二选一）：
#   A. 本文件已在本目录：git mv .github/workflows/resign-orders.yml 激活（同 issue-order）
#   B. 任一有 workflow scope 的机器直接提交到 .github/workflows/
# 手动触发：Actions 页 / gh workflow run resign-orders.yml
# =====================================================================
name: resign-orders

on:
  schedule:
    - cron: '0 2 */3 * *'   # 每 3 天 02:00 UTC 重签（链接 TTL 3 天，无缝覆盖）
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  resign:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 安装 oss2（列订单/读私有日志）
        run: pip install oss2 -i https://mirrors.aliyun.com/pypi/simple/
      - name: 全量重签 + 摘要
        shell: pwsh
        env:
          ASP_OSS_AK: ${{ secrets.ASP_OSS_AK }}
          ASP_OSS_SK: ${{ secrets.ASP_OSS_SK }}
        run: |
          ./scripts/gen-order-tokens.ps1 -ResignAll